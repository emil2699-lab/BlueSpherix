name: Deploy BlueSpherix preview

on:
  push:
    branches:
      - first
  workflow_dispatch:
    inputs:
      sync_notion:
        description: Read Notion before publishing
        type: boolean
        default: false
  schedule:
    - cron: "0 17 * * 1-5"
      timezone: Europe/Rome

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-trades:
    if: github.ref == 'refs/heads/first' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_notion))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v5
        with:
          ref: first

      - name: Reconcile and publish closed trades
        id: publish
        env:
          NOTION_TRADE_TOKEN: ${{ secrets.NOTION_TRADE_TOKEN }}
        run: |
          if [[ -z "$NOTION_TRADE_TOKEN" ]]; then
            echo "::warning::Configure NOTION_TRADE_TOKEN to activate the scheduled trade import."
            exit 0
          fi
          python3 scripts/sync-published-trades.py
          if git diff --quiet -- app/data/published-trades.json; then
            exit 0
          fi
          git add -- app/data/published-trades.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update public closed-trade archive"
          git push origin HEAD:first
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: sync-trades
    if: ${{ !cancelled() && (needs.sync-trades.result == 'skipped' || (needs.sync-trades.result == 'success' && needs.sync-trades.outputs.revision != '')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync-trades.outputs.revision || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
